<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520">
  <rect width="1000" height="520" fill="#121212" rx="8"/>
  <rect width="1000" height="34" fill="#202020" rx="8 8 0 0"/>
  <text x="20" y="22" fill="#ff5f56" font-family="sans-serif" font-size="12" font-weight="bold">Terminal Log Output — Galat 3: Prisma Foreign Key Constraint (P2003)</text>

  <rect x="25" y="55" width="950" height="230" fill="#1a1a1a" stroke="#ff5555" stroke-width="1.5" rx="6"/>
  <text x="40" y="85" fill="#ff6e6e" font-family="Consolas, monospace" font-size="13" font-weight="bold">PrismaClientKnownRequestError:</text>
  <text x="40" y="110" fill="#f8f8f2" font-family="Consolas, monospace" font-size="12">Invalid `prisma.item.delete()` invocation in</text>
  <text x="40" y="130" fill="#8be9fd" font-family="Consolas, monospace" font-size="12">tutorship-nextjs/app/katalog/actions.ts:25:21</text>
  <text x="40" y="160" fill="#f1fa8c" font-family="Consolas, monospace" font-size="13" font-weight="bold">Foreign key constraint failed on the field: `Ulasan_itemId_fkey (index)`</text>
  <text x="40" y="185" fill="#ff79c6" font-family="Consolas, monospace" font-size="12">  code: 'P2003',</text>
  <text x="40" y="205" fill="#bd93f9" font-family="Consolas, monospace" font-size="12">  clientVersion: '7.10.1',</text>
  <text x="40" y="225" fill="#8be9fd" font-family="Consolas, monospace" font-size="12">  meta: { modelName: 'Item', field_name: 'itemId' }</text>
  <text x="40" y="255" fill="#858585" font-family="Consolas, monospace" font-size="11">  at async hapusItem (app/katalog/actions.ts:25:5)</text>

  <rect x="25" y="305" width="950" height="185" fill="#1e2226" stroke="#50fa7b" stroke-width="1.5" rx="6"/>
  <text x="45" y="335" fill="#50fa7b" font-family="sans-serif" font-size="12" font-weight="bold">PENELUSURAN &amp; KEPUTUSAN TEKNIS:</text>
  <text x="45" y="360" fill="#dddddd" font-family="sans-serif" font-size="12">1. Skema relasi Item &lt;- Ulasan menerapkan `onDelete: Restrict` untuk melindungi data ulasan berharga.</text>
  <text x="45" y="385" fill="#dddddd" font-family="sans-serif" font-size="12">2. Ketika Item memiliki ulasan aktif, penghapusan langsung item.delete() ditolak basis data (kode P2003).</text>
  <text x="45" y="410" fill="#dddddd" font-family="sans-serif" font-size="12">3. Pada kode usulan AI awal, galat P2003 ini ditelan mentah-mentah oleh `catch(e) { console.log(...) }` tanpa umpan balik.</text>
  <text x="45" y="440" fill="#f1fa8c" font-family="sans-serif" font-size="12" font-weight="bold">✓ Solusi: Hapus Ulasan dan Item bersamaan di dalam unit transaksi atomik `prisma.$transaction([ ... ])`.</text>
  <text x="45" y="465" fill="#50fa7b" font-family="sans-serif" font-size="12">   Dengan transaksi, bila salah satu gagal, keduanya dibatalkan (rollback) tanpa ada data menggantung!</text>
</svg>
