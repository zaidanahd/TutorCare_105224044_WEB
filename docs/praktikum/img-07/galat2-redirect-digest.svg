<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520">
  <rect width="1000" height="520" fill="#181818" rx="8"/>
  <rect width="1000" height="34" fill="#252526" rx="8 8 0 0"/>
  <text x="20" y="22" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">DEBUG CONSOLE — Galat 2: redirect() Melempar NEXT_REDIRECT dan Tertangkap Blok catch</text>

  <text x="30" y="65" fill="#858585" font-family="Consolas, monospace" font-size="12">// Breakpoint tertahan di baris console.log("Gagal menghapus") pada catch (e) di app/katalog/actions.ts:29</text>
  
  <text x="30" y="100" fill="#569cd6" font-family="Consolas, monospace" font-size="13">&gt; e.message</text>
  <rect x="25" y="110" width="350" height="28" fill="#3a1818" stroke="#ff4444" stroke-width="1"/>
  <text x="30" y="129" fill="#ff79c6" font-family="Consolas, monospace" font-size="13" font-weight="bold">'NEXT_REDIRECT'</text>

  <text x="30" y="165" fill="#569cd6" font-family="Consolas, monospace" font-size="13">&gt; e.digest</text>
  <text x="30" y="190" fill="#ce9178" font-family="Consolas, monospace" font-size="13">'NEXT_REDIRECT;replace;/katalog;303;'</text>

  <rect x="25" y="220" width="950" height="90" fill="#252526" stroke="#444" stroke-width="1" rx="4"/>
  <text x="40" y="245" fill="#4ec9b0" font-family="Consolas, monospace" font-size="12" font-weight="bold">▼ Call Stack Trace saat Tertahan:</text>
  <text x="40" y="270" fill="#ffffff" font-family="Consolas, monospace" font-size="12">▶ hapusItem (app/katalog/actions.ts:29) &lt;-- Menangkap objek NEXT_REDIRECT</text>
  <text x="40" y="292" fill="#858585" font-family="Consolas, monospace" font-size="12">  redirect (next/dist/client/components/redirect.js:50)</text>

  <rect x="25" y="330" width="950" height="155" fill="#202224" stroke="#ff5f56" stroke-width="1.5" rx="6"/>
  <text x="45" y="360" fill="#ff79c6" font-family="sans-serif" font-size="12" font-weight="bold">AKAR PENYEBAB &amp; SOLUSI TEKNIS GALAT 2:</text>
  <text x="45" y="385" fill="#dddddd" font-family="sans-serif" font-size="12">• Framework Next.js mengimplementasikan redirect() dengan sengaja melempar kontrol eksepsi khusus NEXT_REDIRECT.</text>
  <text x="45" y="410" fill="#dddddd" font-family="sans-serif" font-size="12">• Jika redirect() dipanggil di dalam blok try { ... }, blok catch akan mengiranya sebagai galat runtime biasa!</text>
  <text x="45" y="435" fill="#dddddd" font-family="sans-serif" font-size="12">• Akibatnya: Navigasi peramban dibatalkan dan terminal mencetak log error palsu "Gagal menghapus".</text>
  <text x="45" y="460" fill="#73c991" font-family="sans-serif" font-size="12" font-weight="bold">✓ Solusi: Pindahkan pemanggilan redirect("/katalog") ke luar blok try/catch.</text>
</svg>
