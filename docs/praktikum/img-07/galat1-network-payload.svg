<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" width="1000" height="550">
  <rect width="1000" height="550" fill="#1e1e1e" rx="8"/>
  <rect width="1000" height="34" fill="#2d2d2d" rx="8 8 0 0"/>
  <circle cx="20" cy="17" r="5" fill="#ff5f56"/>
  <circle cx="36" cy="17" r="5" fill="#ffbd2e"/>
  <circle cx="52" cy="17" r="5" fill="#27c93f"/>
  <text x="75" y="21" fill="#bbb" font-family="sans-serif" font-size="12">Chrome DevTools — Network Panel (Permintaan POST Server Action Ubah Item)</text>

  <!-- Devtools Tab bar -->
  <rect x="0" y="34" width="1000" height="30" fill="#252526" stroke="#333" stroke-width="1"/>
  <text x="20" y="53" fill="#888" font-family="sans-serif" font-size="11">Elements</text>
  <text x="85" y="53" fill="#888" font-family="sans-serif" font-size="11">Console</text>
  <text x="145" y="53" fill="#888" font-family="sans-serif" font-size="11">Sources</text>
  <text x="205" y="53" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Network</text>
  <rect x="200" y="62" width="55" height="2" fill="#007acc"/>
  <text x="275" y="53" fill="#888" font-family="sans-serif" font-size="11">Components</text>

  <!-- Left: Requests list -->
  <rect x="0" y="64" width="380" height="486" fill="#181818" stroke="#333" stroke-width="1"/>
  <rect x="0" y="64" width="380" height="24" fill="#2d2d2d"/>
  <text x="15" y="80" fill="#aaa" font-family="sans-serif" font-size="11">Name</text>
  <text x="250" y="80" fill="#aaa" font-family="sans-serif" font-size="11">Status</text>
  <text x="320" y="80" fill="#aaa" font-family="sans-serif" font-size="11">Type</text>

  <rect x="0" y="88" width="380" height="32" fill="#094771"/>
  <text x="15" y="108" fill="#ffffff" font-family="Consolas, monospace" font-size="11" font-weight="bold">1/edit (Next-Action)</text>
  <text x="250" y="108" fill="#73c991" font-family="Consolas, monospace" font-size="11">200 OK</text>
  <text x="320" y="108" fill="#aaa" font-family="Consolas, monospace" font-size="11">fetch</text>

  <!-- Right: Request Details & Payload -->
  <rect x="380" y="64" width="620" height="486" fill="#1e1e1e"/>
  <rect x="380" y="64" width="620" height="28" fill="#252526" stroke="#333" stroke-width="1"/>
  <text x="400" y="82" fill="#888" font-family="sans-serif" font-size="11">Headers</text>
  <text x="470" y="82" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Payload</text>
  <rect x="465" y="90" width="50" height="2" fill="#007acc"/>
  <text x="540" y="82" fill="#888" font-family="sans-serif" font-size="11">Preview</text>
  <text x="610" y="82" fill="#888" font-family="sans-serif" font-size="11">Response</text>

  <!-- Payload Content -->
  <text x="410" y="125" fill="#569cd6" font-family="Consolas, monospace" font-size="13" font-weight="bold">▼ Form Data (Field yang Dikirimkan Klien):</text>
  <text x="430" y="155" fill="#9cdcfe" font-family="Consolas, monospace" font-size="12">judul: <tspan fill="#ce9178">"Materi Pembelajaran Next.js 16"</tspan></text>
  <text x="430" y="180" fill="#9cdcfe" font-family="Consolas, monospace" font-size="12">kategori: <tspan fill="#ce9178">"energi"</tspan></text>
  <text x="430" y="205" fill="#9cdcfe" font-family="Consolas, monospace" font-size="12">deskripsi: <tspan fill="#ce9178">"Modul praktikum pemutakhiran kurikulum."</tspan></text>

  <!-- Critical Highlight -->
  <rect x="420" y="222" width="550" height="40" fill="#3a1818" stroke="#ff4444" stroke-width="1.5" rx="4"/>
  <text x="430" y="247" fill="#ff79c6" font-family="Consolas, monospace" font-size="13" font-weight="bold">tersedia: <tspan fill="#ce9178">"false"</tspan>  &lt;-- Dikirimkan sebagai Literal String "false"</text>

  <rect x="410" y="300" width="560" height="180" fill="#252526" rx="6" stroke="#444" stroke-width="1"/>
  <text x="425" y="325" fill="#4ec9b0" font-family="sans-serif" font-size="12" font-weight="bold">ANALISIS PENELUSURAN LAPISAN:</text>
  <text x="425" y="350" fill="#cccccc" font-family="sans-serif" font-size="12">• Lapisan Klien (Peramban): Nilai "false" dikirimkan dengan benar dalam payload HTTP.</text>
  <text x="425" y="375" fill="#cccccc" font-family="sans-serif" font-size="12">• Lapisan Server (Zod): z.coerce.boolean() mengonversi Boolean("false") menjadi TRUE.</text>
  <text x="425" y="400" fill="#cccccc" font-family="sans-serif" font-size="12">• Lapisan Basis Data (Prisma): Menjalankan query UPDATE ... SET tersedia=true (mengikuti Server).</text>
  <text x="425" y="430" fill="#73c991" font-family="sans-serif" font-size="12" font-weight="bold">✓ Kesimpulan: Galat bukan berasal dari UI peramban, melainkan pada lapisan validasi Server.</text>
</svg>
