<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <rect width="1000" height="500" fill="#181818" rx="8"/>
  <rect width="1000" height="34" fill="#252526" rx="8 8 0 0"/>
  <text x="20" y="22" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">DEBUG CONSOLE — Bukti Akar Penyebab Galat 1 (z.coerce.boolean)</text>

  <text x="30" y="70" fill="#569cd6" font-family="Consolas, monospace" font-size="13">&gt; Object.fromEntries(formData)</text>
  <text x="30" y="95" fill="#ce9178" font-family="Consolas, monospace" font-size="13">{ judul: 'Materi Pembelajaran Next.js 16', kategori: 'energi', deskripsi: '...', tersedia: 'false' }</text>

  <text x="30" y="135" fill="#569cd6" font-family="Consolas, monospace" font-size="13">&gt; hasil.data.tersedia</text>
  <rect x="25" y="145" width="400" height="28" fill="#3a2010" stroke="#e5a700" stroke-width="1"/>
  <text x="30" y="165" fill="#ffbd2e" font-family="Consolas, monospace" font-size="13" font-weight="bold">true   // &lt;-- Seharusnya FALSE! Tersimpan keliru.</text>

  <text x="30" y="205" fill="#569cd6" font-family="Consolas, monospace" font-size="13">&gt; Boolean("false")</text>
  <text x="30" y="230" fill="#569cd6" font-family="Consolas, monospace" font-size="13">true   <tspan fill="#6a9955">// String tidak kosong selalu dievaluasi menjadi TRUE oleh constructor Boolean()</tspan></text>

  <text x="30" y="270" fill="#569cd6" font-family="Consolas, monospace" font-size="13">&gt; Boolean("")</text>
  <text x="30" y="295" fill="#569cd6" font-family="Consolas, monospace" font-size="13">false  <tspan fill="#6a9955">// Hanya string kosong yang dievaluasi menjadi FALSE</tspan></text>

  <rect x="25" y="330" width="950" height="135" fill="#202224" stroke="#007acc" stroke-width="1.5" rx="6"/>
  <text x="45" y="360" fill="#4ec9b0" font-family="sans-serif" font-size="12" font-weight="bold">BUKTI HIPOTESIS &amp; AKAR PENYEBAB:</text>
  <text x="45" y="385" fill="#dddddd" font-family="sans-serif" font-size="12">1. AI mengusulkan `tersedia: z.coerce.boolean()` yang menggunakan fungsi `Boolean(input)` bawaan JS.</text>
  <text x="45" y="410" fill="#dddddd" font-family="sans-serif" font-size="12">2. Ketika pengguna memilih opsi "Tidak tersedia", elemen &lt;select&gt; mengirimkan string `"false"`.</text>
  <text x="45" y="435" fill="#73c991" font-family="sans-serif" font-size="12" font-weight="bold">3. Perbaikan: Ubah skema menjadi `tersedia: z.stringbool()` yang secara spesifik memetakan "false" ke boolean false.</text>
</svg>
